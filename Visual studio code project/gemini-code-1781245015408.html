<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Kaisen: Cursed Technique Scanner</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #video_container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video {
            display: none; /* Sembunyikan video asli */
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Cermin */
            object-fit: cover;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }
        #status {
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            margin-bottom: 10px;
        }
        .technique-text {
            font-size: 40px;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 0 0 20px currentColor;
            opacity: 0;
            transition: opacity 0.3s;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="video_container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
    </div>
    <div id="ui-layer">
        <div id="status">Mencari Energi Kutukan...</div>
        <div id="technique-name" class="technique-text"></div>
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const statusText = document.getElementById('status');
        const techName = document.getElementById('technique-name');

        // Sesuaikan ukuran canvas dengan layar
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- SISTEM PARTIKEL ---
        let particles = [];
        
        class Particle {
            constructor(x, y, color, type) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                this.life = 1.0;
                
                if (type === 'red') {
                    // Partikel berputar untuk RED
                    this.vx = (Math.random() - 0.5) * 10;
                    this.vy = (Math.random() - 0.5) * 10;
                    this.size = Math.random() * 5 + 2;
                    this.decay = 0.02;
                } else if (type === 'slash') {
                    // Tebasan untuk Malevolent Shrine
                    this.vx = (Math.random() - 0.5) * 40;
                    this.vy = (Math.random() - 0.5) * 40;
                    this.size = Math.random() * 100 + 50; // Panjang tebasan
                    this.decay = 0.05;
                    this.angle = Math.random() * Math.PI * 2;
                }
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }

            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.shadowBlur = 20;
                ctx.shadowColor = this.color;
                
                if (this.type === 'red') {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                } else if (this.type === 'slash') {
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.angle);
                    ctx.beginPath();
                    ctx.moveTo(-this.size/2, 0);
                    ctx.lineTo(this.size/2, 0);
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        // --- FUNGSI UTAMA TRACKING ---
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Gambar Video Asli
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let activeTechnique = "none";
            let centerPoint = { x: 0, y: 0 };

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                statusText.innerText = "Tangan Terdeteksi!";
                statusText.style.color = "#ffffff";

                // Gambar Garis Tangan (Visual Tracker)
                for (const landmarks of results.multiHandLandmarks) {
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: 'rgba(0, 255, 204, 0.5)', lineWidth: 2});
                    drawLandmarks(canvasCtx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 2});
                }

                // LOGIKA DETEKSI JURUS
                if (results.multiHandLandmarks.length === 1) {
                    // Deteksi RED: Jempol (4) dan Telunjuk (8) bersentuhan
                    let lm = results.multiHandLandmarks[0];
                    let dist = Math.hypot(lm[8].x - lm[4].x, lm[8].y - lm[4].y);
                    
                    if (dist < 0.05) {
                        activeTechnique = "RED";
                        centerPoint.x = lm[8].x * canvasElement.width;
                        centerPoint.y = lm[8].y * canvasElement.height;
                    }

                } else if (results.multiHandLandmarks.length === 2) {
                    // Deteksi MALEVOLENT SHRINE: Kedua pergelangan tangan (0) saling berdekatan
                    let lm1 = results.multiHandLandmarks[0];
                    let lm2 = results.multiHandLandmarks[1];
                    let dist = Math.hypot(lm1[0].x - lm2[0].x, lm1[0].y - lm2[0].y);

                    if (dist < 0.15) {
                        activeTechnique = "SHRINE";
                        centerPoint.x = (lm1[0].x + lm2[0].x) / 2 * canvasElement.width;
                        centerPoint.y = (lm1[0].y + lm2[0].y) / 2 * canvasElement.height;
                    }
                }
            } else {
                statusText.innerText = "Mencari Energi Kutukan...";
                statusText.style.color = "#00ffcc";
            }

            // --- EKSEKUSI VISUAL JURUS ---
            if (activeTechnique === "RED") {
                techName.innerText = "Reversal: Red";
                techName.style.color = "#ff0000";
                techName.style.opacity = 1;
                // Spawn partikel merah di ujung jari
                for(let i = 0; i < 10; i++) {
                    particles.push(new Particle(centerPoint.x, centerPoint.y, '#ff0000', 'red'));
                    particles.push(new Particle(centerPoint.x, centerPoint.y, '#ffffff', 'red')); // Inti putih
                }
            } else if (activeTechnique === "SHRINE") {
                techName.innerText = "Domain Expansion: Malevolent Shrine";
                techName.style.color = "#8b0000";
                techName.style.opacity = 1;
                
                // Efek layar gelap
                canvasCtx.fillStyle = "rgba(0, 0, 0, 0.6)";
                canvasCtx.fillRect(0, 0, canvasElement.width, canvasElement.height);

                // Spawn partikel tebasan di mana-mana
                for(let i = 0; i < 5; i++) {
                    let rx = Math.random() * canvasElement.width;
                    let ry = Math.random() * canvasElement.height;
                    particles.push(new Particle(rx, ry, '#ff0000', 'slash'));
                    particles.push(new Particle(rx, ry, '#000000', 'slash'));
                }
            } else {
                techName.style.opacity = 0;
            }

            // Update & Gambar Partikel
            canvasCtx.globalCompositeOperation = 'lighter'; // Biar efeknya menyala/glowing
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(canvasCtx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1); // Hapus partikel yang mati
                }
            }
            canvasCtx.globalCompositeOperation = 'source-over'; // Kembalikan ke normal

            canvasCtx.restore();
        }

        // --- SETUP CAMERA & MEDIAPIPE ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.6,
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>

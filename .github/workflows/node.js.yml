name: Project tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The pinned @php-wasm/* 3.1.60 harness requires Node >= 24.18.0
        # and npm >= 11.16.0.
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: cyberlab/tests/wasm/package-lock.json

      - name: Install CyberLab WASM test dependencies
        working-directory: cyberlab/tests/wasm
        run: npm ci --ignore-scripts

      - name: Verify Academy runtime copied into CyberLab
        run: node cyberlab/tools/check-academy-parity.js

      - name: Verify CyberLab server catalog matches Academy dataset
        run: node cyberlab/tools/export-catalog.js --check

      - name: Verify CTF Analyst Academy data
        run: node ctf-analyst-academy/tools/verify.js

      - name: Smoke test CTF Analyst Academy UI
        run: node ctf-analyst-academy/tools/smoke.js

      - name: CyberLab unit tests (PHP-WASM + SQLite)
        working-directory: cyberlab/tests/wasm
        run: npm run test:unit

      - name: CyberLab HTTP request-cycle tests
        working-directory: cyberlab/tests/wasm
        run: npm run test:http

      - name: CyberLab code-runner tests
        working-directory: cyberlab/tests/wasm
        run: npm run test:code-runner
